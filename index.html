<!DOCTYPE html>
<html lang="bn">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#130d0d"
    >

    <title>PujoAschhe</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>


<body>

    <main class="page">


      <div class="copyright">
  © 2026 <span>@pujoaschhe-subhom</span>
</div>


        <!-- =================================================
             MEMORY / TAGLINE
        ================================================== -->

        <div class="memory-line">
  
            <span>Enjoy the OG Pujor Gaan with your friend, family & Closed one.</span>
            
        </div>


        <!-- =================================================
             COUNTDOWN
        ================================================== -->

        <section
            class="countdown"
            aria-label="Countdown to Mahalaya"
        >

            <div class="eyebrow">
                Countdown remaining-Until Mahalaya
            </div>


            <div class="timer">


                <!-- DAYS -->

                <div class="unit">

                    <div
                        class="num"
                        id="days"
                    >
                        00
                    </div>

                    <div class="label">
                        DAYS
                    </div>

                </div>


                <!-- HOURS -->

                <div class="unit">

                    <div
                        class="num"
                        id="hours"
                    >
                        00
                    </div>

                    <div class="label">
                        HOURS
                    </div>

                </div>


                <!-- MINUTES -->

                <div class="unit">

                    <div
                        class="num"
                        id="mins"
                    >
                        00
                    </div>

                    <div class="label">
                        MINUTES
                    </div>

                </div>


                <!-- SECONDS -->

                <div class="unit">

                    <div
                        class="num"
                        id="secs"
                    >
                        00
                    </div>

                    <div class="label">
                        SECONDS
                    </div>

                </div>

            </div>


            <!-- MAHALAYA DATE -->

            <div class="date">
                Mahalaya · 10 October 2026
            </div>

        </section>



        <!-- =================================================
             MUSIC PLAYER
        ================================================== -->

        <section
            class="player"
            aria-label="Pujo music player"
        >


            <!-- PLAY / PAUSE -->

            <button
                class="play"
                id="play"
                aria-label="Play"
            >
                ▶
            </button>


            <!-- SONG INFORMATION -->

            <div class="track">

                <div
                    class="track-title"
                    id="title"
                >
                    Loading Pujo music…
                </div>

                <div class="track-sub">
                    Pujo music · YouTube audio player
                </div>

            </div>


            <!-- MUSIC CONTROLS -->

            <div class="controls">

                <button
                    class="icon"
                    id="prev"
                    aria-label="Previous song"
                >
                    ⏮
                </button>

                <button
                    class="icon"
                    id="next"
                    aria-label="Next song"
                >
                    ⏭
                </button>

                <button
                    class="icon"
                    id="mute"
                    aria-label="Mute"
                >
                    🔊
                </button>

            </div>


            <!-- PROGRESS BAR -->

            <div class="progress-wrap">

                <input
                    class="progress"
                    id="progress"
                    type="range"
                    min="0"
                    max="100"
                    value="0"
                    step="0.1"
                    aria-label="Seek"
                >

                <div
                    class="time"
                    id="time"
                >
                    0:00 / 0:00
                </div>

            </div>

        </section>


        <!-- =================================================
             FOOTER NOTE
        ================================================== -->

        <div class="note">
            NO SCROLL · JUST COUNTDOWN & MUSIC
        </div>

    </main>


    <!-- =====================================================
         HIDDEN YOUTUBE PLAYER
    ====================================================== -->

    <div id="yt"></div>


    <!-- YouTube API -->

    <script src="https://www.youtube.com/iframe_api"></script>


    <!-- Your JavaScript -->

    <script src="script.js"></script>

</body>

</html>
